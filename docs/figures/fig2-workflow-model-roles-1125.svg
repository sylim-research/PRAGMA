<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 990" width="2000" height="990" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1E2A44" stroke-width="1.6"/>
    </marker>
    <style>
      .t { fill:#1E2A44; }
      .num { font-size:30px; font-weight:800; letter-spacing:2px; fill:#1E2A44; }
      .h { font-size:35px; font-weight:800; }
      .s { font-size:25.5px; fill:#3F4A61; }
      .sw { font-size:25.5px; fill:#E6E9F2; }
      .chip { font-size:25px; font-weight:700; }
      .row { font-size:30px; font-weight:800; fill:#1E2A44; }
      .rowsub { font-size:26px; fill:#5B647A; }
      .leg { font-size:26px; fill:#3F4A61; }
      .line { stroke:#1E2A44; stroke-width:2.2; fill:none; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="1997" height="987" rx="34" fill="#FFFFFF" stroke="#DADDE6" stroke-width="3"/>

  <!-- 제목 -->
  <text x="70" y="96" font-size="27" font-weight="700" letter-spacing="4" fill="#5B647A">Fig. 2</text>
  <text x="182" y="96" font-size="32" font-weight="800" class="t">콘텐츠 제작·학습 워크플로우와 AI 모델 배정</text>
  <line x1="880" y1="87" x2="1930" y2="87" stroke="#E3E6EE" stroke-width="2"/>

  <!-- 범례 -->
  <g transform="translate(70,138)">
    <rect width="34" height="26" rx="7" fill="#FBF3D6" stroke="#D9B23A" stroke-width="2.5"/>
    <text x="46" y="21" class="leg"><tspan font-weight="800" fill="#1E2A44">생성</tspan> Gemini 3.1 Pro</text>
    <rect x="390" width="34" height="26" rx="7" fill="#FFFFFF" stroke="#1E2A44" stroke-width="2.5"/>
    <text x="436" y="21" class="leg"><tspan font-weight="800" fill="#1E2A44">심사·피드백</tspan> GPT-6 Astra</text>
    <rect x="770" width="34" height="26" rx="7" fill="#EEF0F6" stroke="#8A93A8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="816" y="21" class="leg"><tspan font-weight="800" fill="#1E2A44">규칙 점검 코드</tspan> 세고 대조</text>
    <rect x="1150" width="34" height="26" rx="7" fill="#1E2A44"/>
    <text x="1196" y="21" class="leg"><tspan font-weight="800" fill="#1E2A44">교수자</tspan> 감수·최종 결정</text>
  </g>

  <!-- ── 1줄: 콘텐츠 제작 ── -->
  <text x="70" y="248" class="row">콘텐츠 제작</text>
  <text x="232" y="248" class="rowsub">관리자 화면 · 학습자에게 공개되기 전</text>

  <text x="70" y="306" class="num">01</text>
  <rect x="70" y="322" width="332" height="220" rx="22" fill="#FBF3D6" stroke="#D9B23A" stroke-width="3"/>
  <text x="236" y="386" text-anchor="middle" class="h t">시나리오 생성</text>
  <text x="236" y="432" text-anchor="middle" class="s">상황·관계·원문</text>
  <rect x="121.0" y="458" width="230" height="44" rx="22" fill="#FFFFFF" stroke="#D9B23A" stroke-width="2"/>
  <text x="236" y="489" text-anchor="middle" class="chip t">Gemini 3.1 Pro</text>

  <text x="452" y="306" class="num">02</text>
  <rect x="452" y="322" width="332" height="220" rx="22" fill="#FBF3D6" stroke="#D9B23A" stroke-width="3"/>
  <text x="618" y="386" text-anchor="middle" class="h t">학습 미션 생성</text>
  <text x="618" y="432" text-anchor="middle" class="s">MJT · DCT형 과제</text>
  <rect x="503.0" y="458" width="230" height="44" rx="22" fill="#FFFFFF" stroke="#D9B23A" stroke-width="2"/>
  <text x="618" y="489" text-anchor="middle" class="chip t">Gemini 3.1 Pro</text>

  <text x="834" y="306" class="num">03</text>
  <rect x="834" y="322" width="332" height="220" rx="22" fill="#EEF0F6" stroke="#8A93A8" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="1000" y="386" text-anchor="middle" class="h t">자동 규칙 점검</text>
  <text x="1000" y="432" text-anchor="middle" class="s">형식·문항 구성·조건</text>
  <rect x="895.0" y="458" width="210" height="44" rx="22" fill="#FFFFFF" stroke="#8A93A8" stroke-width="2"/>
  <text x="1000" y="489" text-anchor="middle" class="chip" fill="#3F4A61">규칙 점검 코드</text>

  <text x="1216" y="306" class="num">04</text>
  <rect x="1216" y="322" width="332" height="220" rx="22" fill="#FFFFFF" stroke="#1E2A44" stroke-width="3"/>
  <text x="1382" y="386" text-anchor="middle" class="h t">AI 품질 심사</text>
  <text x="1382" y="432" text-anchor="middle" class="s">의미·화행·자연성 심사</text>
  <rect x="1277.0" y="458" width="210" height="44" rx="22" fill="#1E2A44"/>
  <text x="1382" y="489" text-anchor="middle" class="chip" fill="#FFFFFF">GPT-6 Astra</text>

  <text x="1598" y="306" class="num">05</text>
  <rect x="1598" y="322" width="332" height="220" rx="22" fill="#1E2A44"/>
  <text x="1764" y="386" text-anchor="middle" class="h" fill="#FFFFFF">교수자 최종 승인</text>
  <text x="1764" y="434" text-anchor="middle" class="sw">내용·교육 적합성</text>
  <text x="1764" y="476" text-anchor="middle" class="sw">승인·보류·사용 결정</text>

  <line x1="402" y1="432" x2="448" y2="432" class="line" marker-end="url(#arrow)"/>
  <line x1="784" y1="432" x2="830" y2="432" class="line" marker-end="url(#arrow)"/>
  <line x1="1166" y1="432" x2="1212" y2="432" class="line" marker-end="url(#arrow)"/>
  <line x1="1548" y1="432" x2="1594" y2="432" class="line" marker-end="url(#arrow)"/>

  <text x="1930" y="592" text-anchor="end" font-size="26" font-weight="800" class="t">승인된 학습 미션 → 15주 교과목 편성</text>
  <path d="M1764,608 L1764,662 L236,662 L236,714" class="line" marker-end="url(#arrow)"/>
  <text x="70" y="640" class="row">학습</text>
  <text x="138" y="640" class="rowsub">학습자 화면 · 실시간, 교수자 승인을 거칠 수 없는 구간</text>

  <rect x="70" y="720" width="332" height="200" rx="22" fill="#FFFFFF" stroke="#C9CEDA" stroke-width="2.5"/>
  <text x="236" y="806" text-anchor="middle" class="h t">MJT 판단 문항</text>
  <text x="236" y="852" text-anchor="middle" class="s">5개 문항 판단</text>

  <rect x="452" y="720" width="332" height="200" rx="22" fill="#FFFFFF" stroke="#C9CEDA" stroke-width="2.5"/>
  <text x="618" y="806" text-anchor="middle" class="h t">DCT형 통번역</text>
  <text x="618" y="852" text-anchor="middle" class="s">학습자 답안 제출</text>

  <rect x="834" y="720" width="332" height="200" rx="22" fill="#FFFFFF" stroke="#1E2A44" stroke-width="3"/>
  <text x="1000" y="784" text-anchor="middle" class="h t">피드백 작성</text>
  <text x="1000" y="830" text-anchor="middle" class="s">세 기준 판정과 설명</text>
  <rect x="895.0" y="850" width="210" height="44" rx="22" fill="#1E2A44"/>
  <text x="1000" y="881" text-anchor="middle" class="chip" fill="#FFFFFF">GPT-6 Astra</text>

  <rect x="1216" y="720" width="332" height="200" rx="22" fill="#FFFFFF" stroke="#C9CEDA" stroke-width="2.5"/>
  <text x="1382" y="784" text-anchor="middle" class="h t">학습자에게 표시</text>
  <text x="1382" y="830" text-anchor="middle" class="s">세 단계 판정과 설명</text>
  <text x="1382" y="870" text-anchor="middle" class="s">고칠 순서 · 표현 힌트</text>

  <rect x="1598" y="720" width="332" height="200" rx="22" fill="#FFFFFF" stroke="#1E2A44" stroke-width="2.5"/>
  <text x="1764" y="784" text-anchor="middle" class="h t">학습자 최종 결정</text>
  <text x="1764" y="830" text-anchor="middle" class="s">초안 유지 또는 수정</text>
  <text x="1764" y="870" text-anchor="middle" class="s">과정 메모와 함께 저장</text>

  <line x1="402" y1="820" x2="448" y2="820" class="line" marker-end="url(#arrow)"/>
  <line x1="784" y1="820" x2="830" y2="820" class="line" marker-end="url(#arrow)"/>
  <line x1="1166" y1="820" x2="1212" y2="820" class="line" marker-end="url(#arrow)"/>
  <line x1="1548" y1="820" x2="1594" y2="820" class="line" marker-end="url(#arrow)"/>
</svg>
