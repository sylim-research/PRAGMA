name: PRAGMA CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pragma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-static-placeholder
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Blocks API keys, tokens and passwords before they reach this public repository. Runs on every change,
      # docs-only included. Scans only the commits this event adds; earlier history was scanned once
      # (public client keys allowlisted in .gitleaksignore). Pinned release, checksum verified.
      - name: Scan new commits for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz"             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="-1 ${{ github.sha }}"
          fi
          echo "Scanning $range"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --no-banner --exit-code 1 .

      # A pull request that only touches README.md, docs/figures, docs/brand or docs/dev-log skips the heavy steps but still
      # reports this check as passed, so the required status stays satisfied.
      - name: Detect docs-only change
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(README\.md|docs/(figures|brand|dev-log)/)'; then
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "Docs-only change: skipping build and tests."
              exit 0
            fi
          fi
          echo "code=true" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.scope.outputs.code == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.scope.outputs.code == 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.scope.outputs.code == 'true'
        run: npm test

      - name: Verify production release policy
        if: steps.scope.outputs.code == 'true'
        run: npm run release:policy-test

      - name: Check content approval boundary (local PostgreSQL)
        if: steps.scope.outputs.code == 'true'
        run: npm run review:db-test

      - name: Check teaching generator handler (isolated services)
        if: steps.scope.outputs.code == 'true'
        run: node --test scripts/teaching-materials-edge.test.mjs scripts/content-review-edge.test.mjs scripts/scene-grounding-edge.test.mjs

      - name: Check generation job access and leases (local PostgreSQL)
        if: steps.scope.outputs.code == 'true'
        run: node --test scripts/generation-jobs-db.test.mjs

      - name: Build production bundle
        if: steps.scope.outputs.code == 'true'
        run: npm run build

